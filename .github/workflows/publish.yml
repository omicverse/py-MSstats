name: Publish to PyPI

# Builds the sdist + wheel on a GitHub-hosted runner and publishes to
# PyPI via OIDC Trusted Publishing (no API token needed — the project's
# trusted publisher is configured on pypi.org for omicverse/py-MSstats
# + this workflow file).
#
# Triggers:
#   * workflow_dispatch — manual one-click release.
#   * schedule — every 6 h. Auto-retries: PyPI applies a day-scale rate
#     limit on new-project creation, so the first publish may 429 for a
#     while. ``skip-existing: true`` makes every post-publish run a
#     harmless no-op, so the schedule can be deleted once the project is
#     live on PyPI.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
